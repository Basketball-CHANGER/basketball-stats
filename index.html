<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANGER Stats Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .q-btn.active { 
            background-color: #238636 !important; 
            color: white !important; 
            border-color: #3fb950 !important; 
            box-shadow: 0 0 12px rgba(63, 185, 80, 0.4);
            font-weight: bold;
        }
        .table-wrapper { margin-top: 30px; background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; overflow: hidden; }
        th { background-color: #1f2937; color: #8b949e; font-size: 0.7rem; padding: 12px 4px; border-bottom: 2px solid #30363d; }
        td { padding: 10px 6px; border-bottom: 1px solid #21262d; font-size: 0.85rem; text-align: center; }
        .name-col { color: #58a6ff; font-weight: bold; text-align: center !important; width: 130px; min-width: 130px; }
        .foul-danger { color: #f85149; font-weight: bold; background: rgba(248, 81, 73, 0.1); border-radius: 6px; }
        .stats-dashboard { margin-top: 24px; border-radius: 16px; padding: 24px; border: 1px solid #30363d; }
        .home-dashboard { background: linear-gradient(90deg, #161b22 0%, #111827 100%); border-left: 4px solid #3b82f6; }
        .away-dashboard { background: linear-gradient(90deg, #1c1111 0%, #161b22 100%); border-left: 4px solid #ef4444; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-bonus { animation: pulse-red 1s infinite; color: #f85149 !important; }
        @media (max-width: 768px) {
            .scoreboard-grid { grid-template-columns: 1fr !important; gap: 2rem; }
            .dashboard-stats-grid { grid-template-columns: repeat(3, 1fr) !important; }
            .score-text { font-size: 4rem !important; }
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-[1440px] mx-auto">
        <!-- 헤더 및 쿼터 버튼 -->
        <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-4xl font-black text-white italic uppercase">Changer</h1>
                <span id="match-title-display" class="bg-blue-900/40 text-blue-400 text-xs font-bold px-4 py-1.5 rounded-full border border-blue-800/50">SYNCING...</span>
            </div>
            <div class="flex bg-[#161b22] p-1.5 rounded-xl border border-[#30363d] overflow-x-auto">
                <button onclick="loadData('TOTAL')" class="q-btn active px-4 md:px-6 py-2.5 rounded-lg text-sm transition-all">전체</button>
                <button onclick="loadData('1Q')" class="q-btn px-4 md:px-6 py-2.5 rounded-lg text-sm transition-all">1Q</button>
                <button onclick="loadData('2Q')" class="q-btn px-4 md:px-6 py-2.5 rounded-lg text-sm transition-all">2Q</button>
                <button onclick="loadData('3Q')" class="q-btn px-4 md:px-6 py-2.5 rounded-lg text-sm transition-all">3Q</button>
                <button onclick="loadData('4Q')" class="q-btn px-4 md:px-6 py-2.5 rounded-lg text-sm transition-all">4Q</button>
            </div>
        </div>

        <!-- 스코어보드 -->
        <div class="grid grid-cols-3 gap-6 bg-[#161b22] p-6 md:p-10 rounded-[32px] border border-[#30363d] items-center mb-8 scoreboard-grid">
            <div class="text-center">
                <p class="text-blue-400 font-black text-sm mb-2 uppercase tracking-widest">Home</p>
                <p id="our-score" class="text-7xl md:text-8xl font-black text-white mb-4 score-text">0</p>
                <div class="flex justify-center items-baseline gap-3"><span class="text-slate-500 text-xl font-black">TF</span><span id="our-foul-val" class="text-xl font-black text-white">0</span></div>
            </div>
            <div class="text-center border-x border-slate-800/50 px-4">
                <p id="current-q-label" class="text-yellow-500 text-4xl font-black italic mb-2 uppercase">TOTAL</p>
                <p class="text-slate-600 text-xs font-bold tracking-[0.5em]">VS</p>
            </div>
            <div class="text-center">
                <p id="opp-name-display" class="text-red-400 font-black text-sm mb-2 uppercase tracking-widest">Away</p>
                <p id="opp-score" class="text-7xl md:text-8xl font-black text-white mb-4 score-text">0</p>
                <div class="flex justify-center items-baseline gap-3"><span class="text-slate-500 text-xl font-black">TF</span><span id="opp-foul-val" class="text-xl font-black text-white">0</span></div>
            </div>
        </div>

        <!-- 우리팀 대시보드 및 테이블 생략 (구조 유지) -->
        <div id="stats-container">
            <!-- JavaScript가 여기에 데이터를 채웁니다 -->
        </div>

        <!-- 하단 상세 테이블 -->
        <div class="table-wrapper overflow-x-auto mb-8">
            <table class="w-full border-collapse min-w-[1200px]">
                <thead>
                    <tr>
                        <th>No</th><th class="name-col">NAME</th><th class="text-orange-400">PF</th><th>MIN</th><th class="text-white">PTS</th>
                        <th>2P M/A</th><th>2P%</th><th>3P M/A</th><th>3P%</th><th>FT M/A</th><th>FT%</th>
                        <th>OR</th><th>DR</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th>
                        <th class="text-yellow-400 border-l border-slate-700">PER</th><th>GRADE</th>
                    </tr>
                </thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>

        <!-- 상대팀 요약 대시보드 -->
        <div id="opp-stats-footer" class="stats-dashboard away-dashboard">
            <div class="flex justify-between items-center mb-6">
                <span class="text-red-500 font-black text-2xl italic uppercase"><span id="opp-footer-name">AWAY</span> STATS</span>
                <div class="grid grid-cols-5 gap-4 text-center">
                    <div><p class="text-slate-500 text-[10px] font-bold">REB</p><p id="opp-f-reb" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">AST</p><p id="opp-f-ast" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">STL</p><p id="opp-f-stl" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">BLK</p><p id="opp-f-blk" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-red-900 text-[10px] font-bold">TO</p><p id="opp-f-to" class="text-red-600 font-black text-xl">0</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbyViqf4EfaN6oLBcuKm_bXlM_30vFCxpCxxFbiRDgXg5PdHuTYk66NmdutnzQUoO4mQ/exec";

        async function loadData(q) {
            const getRate = (m, a) => a > 0 ? Math.round((m / a) * 100) : 0;
            
            // 버튼 활성화 처리
            document.querySelectorAll('.q-btn').forEach(btn => {
                const btnText = btn.innerText === '전체' ? 'TOTAL' : btn.innerText;
                btn.classList.toggle('active', btnText === q);
            });
            document.getElementById('current-q-label').innerText = q;

            try {
                const response = await fetch(`${BASE_API_URL}?q=${q}`);
                const data = await response.json();

                // 타이틀 및 우리팀 합계 계산
                document.getElementById('match-title-display').innerText = data.matchTitle || "경기 정보 없음";
                
                const teamStats = data.stats;
                const homePts = teamStats.reduce((acc, p) => acc + p.PTS, 0);
                const homeFoul = teamStats.reduce((acc, p) => acc + p.PF, 0);

                document.getElementById('our-score').innerText = homePts;
                document.getElementById('our-foul-val').innerText = homeFoul;
                document.getElementById('our-foul-val').className = homeFoul >= 5 ? "text-xl font-black animate-bonus" : "text-xl font-black text-white";

                // 상대팀 데이터 렌더링 (소문자 키값 주의)
                if (data.opp) {
                    const o = data.opp;
                    document.getElementById('opp-name-display').innerText = o.name;
                    document.getElementById('opp-footer-name').innerText = o.name;
                    document.getElementById('opp-score').innerText = o.pts;
                    document.getElementById('opp-foul-val').innerText = o.tf;
                    document.getElementById('opp-f-reb').innerText = o.reb;
                    document.getElementById('opp-f-ast').innerText = o.ast;
                    document.getElementById('opp-f-stl').innerText = o.stl;
                    document.getElementById('opp-f-blk').innerText = o.blk;
                    document.getElementById('opp-f-to').innerText = o.to;
                }

                // 테이블 본문 생성
                const tbody = document.getElementById('stats-body');
                tbody.innerHTML = teamStats.map(p => {
                    const per = parseFloat(p.PER || 0);
                    let grade = per >= 25 ? "ACE" : per >= 15 ? "GOOD" : "ROLE";
                    return `
                        <tr>
                            <td>${p.No}</td>
                            <td class="name-col">${p.Name}</td>
                            <td class="${p.PF >= 4 ? 'foul-danger' : ''}">${p.PF}</td>
                            <td>${p.MIN}</td>
                            <td class="text-white font-bold">${p.PTS}</td>
                            <td>${p.FGM}/${p.FGA}</td><td>${getRate(p.FGM, p.FGA)}%</td>
                            <td>${p.TPM}/${p.TPA}</td><td>${getRate(p.TPM, p.TPA)}%</td>
                            <td>${p.FTM}/${p.FTA}</td><td>${getRate(p.FTM, p.FTA)}%</td>
                            <td>${p.OR}</td><td>${p.DR}</td><td class="text-white font-bold">${p.REB}</td>
                            <td>${p.AST}</td><td>${p.STL}</td><td>${p.BLK}</td><td>${p.TO}</td>
                            <td class="text-yellow-500 font-black">${per.toFixed(1)}</td>
                            <td class="text-xs italic">${grade}</td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("데이터 로드 실패:", err);
            }
        }

        window.onload = () => loadData('TOTAL');
    </script>
</body>
</html>

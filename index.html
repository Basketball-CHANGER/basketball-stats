<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Basketball Stats Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .nav-btn { transition: all 0.2s; border: 1px solid #30363d; cursor: pointer; }
        .nav-btn.active { background-color: #238636; border-color: #3fb950; color: white; font-weight: bold; }
        .table-wrapper { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        th { background-color: #1f2937; color: #8b949e; font-size: 0.65rem; padding: 12px 4px; border-bottom: 2px solid #30363d; }
        td { padding: 12px 6px; border-bottom: 1px solid #21262d; font-size: 0.8rem; }
        tr:hover { background-color: #1c2128; }
        .name-col { color: #58a6ff; font-weight: bold; text-align: left; padding-left: 16px; min-width: 120px; }
        .pts-col { color: #ffffff; font-weight: 800; font-size: 0.95rem; }
        .foul-danger { color: #f85149; font-weight: bold; background: rgba(248, 81, 73, 0.1); border-radius: 4px; }
        
        /* PER 등급 스타일 */
        .grade-best { color: #f2ca33; font-weight: 900; text-decoration: underline; }
        .grade-good { color: #34d399; font-weight: bold; }
        .grade-normal { color: #e2e8f0; }
        .grade-effort { color: #4b5563; font-style: italic; }

        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-bonus { animation: pulse-red 1s infinite; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1500px] mx-auto">
        <!-- 상단 헤더 -->
        <div class="flex flex-col lg:flex-row justify-between items-center mb-8 gap-6">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">🏀 TEAM ANALYTICS</h1>
                <p id="current-view-title" class="text-blue-400 text-sm font-bold mt-1 uppercase text-center lg:text-left">Loading...</p>
            </div>

            <div id="team-foul-display"></div>
            
            <div class="flex bg-[#161b22] p-1 rounded-lg border border-[#30363d]">
                <button onclick="loadQuarter('TOTAL')" class="nav-btn active px-5 py-2 rounded-md text-sm mr-1">전체</button>
                <button onclick="loadQuarter('1Q')" class="nav-btn px-5 py-2 rounded-md text-sm mr-1">1Q</button>
                <button onclick="loadQuarter('2Q')" class="nav-btn px-5 py-2 rounded-md text-sm mr-1">2Q</button>
                <button onclick="loadQuarter('3Q')" class="nav-btn px-5 py-2 rounded-md text-sm mr-1">3Q</button>
                <button onclick="loadQuarter('4Q')" class="nav-btn px-5 py-2 rounded-md text-sm">4Q</button>
            </div>
        </div>
        
        <!-- 메인 테이블 -->
        <div class="table-wrapper overflow-x-auto shadow-2xl">
            <table class="w-full text-center border-collapse min-w-[1400px]">
                <thead>
                    <tr>
                        <th class="text-left pl-4 w-16">No</th>
                        <th class="text-left pl-4">NAME</th>
                        <th class="text-orange-400">PF</th>
                        <th>MIN</th>
                        <th class="text-white text-lg">PTS</th>
                        <th>2P M/A</th>
                        <th>2P%</th>
                        <th>3P M/A</th>
                        <th>3P%</th>
                        <th>FT M/A</th>
                        <th>FT%</th>
                        <th>OR</th>
                        <th>DR</th>
                        <th class="text-slate-200">REB</th>
                        <th>AST</th>
                        <th>STL</th>
                        <th>BLK</th>
                        <th>TO</th>
                        <th class="text-yellow-400 font-bold border-l border-slate-700">PER (RANK)</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                    <tr><td colspan="19" class="py-32 text-slate-500 text-center animate-pulse">데이터를 동기화 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
        <p class="mt-4 text-[10px] text-slate-600 text-center uppercase tracking-[0.2em]">Data refined by Hollinger's Efficiency Rating System</p>
    </div>

    <script>
        // 여기에 본인의 새 배포 URL을 넣으세요
        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbz_rcQTBmqIxxJWzxPIG-HoT2M96GcT8SoVQkIZpci1dt5BJBD7Yz-hbggMdWuw7w6q/exec";

        window.onload = () => loadQuarter('TOTAL');

        async function loadQuarter(qName) {
            updateButtonUI(qName);
            document.getElementById('current-view-title').innerText = `Viewing: ${qName} Statistics`;
            
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '<tr><td colspan="19" class="py-32 text-slate-500 text-center">Loading Data...</td></tr>';

            try {
                const response = await fetch(`${BASE_API_URL}?q=${qName}`);
                const data = await response.json();
                
                // 팀파울 업데이트
                const teamFouls = data.reduce((acc, p) => acc + (parseInt(p.PF) || 0), 0);
                updateTeamFoulUI(teamFouls, qName);

                tbody.innerHTML = '';

                data.forEach(p => {
                    const getRate = (m, a) => a > 0 ? Math.round((m / a) * 100) : 0;
                    
                    const rowPER = parseFloat(p.PER || 0);
                    let grade = ""; let gradeStyle = "";
                    if (rowPER >= 20) { grade = "최고"; gradeStyle = "grade-best"; }
                    else if (rowPER >= 15) { grade = "준수"; gradeStyle = "grade-good"; }
                    else if (rowPER >= 10) { grade = "1인분"; gradeStyle = "grade-normal"; }
                    else { grade = "노력"; gradeStyle = "grade-effort"; }

                    const foulClass = p.PF >= 4 ? 'foul-danger' : '';

                    const row = `
                        <tr>
                            <td class="text-slate-500 font-mono pl-4 text-left">${p.No || '-'}</td>
                            <td class="name-col">${p.Name}</td>
                            <td class="${foulClass} font-bold">${p.PF || 0}</td>
                            <td class="text-slate-500 font-mono">${p.MIN || 0}</td>
                            <td class="pts-col text-base">${p.PTS || 0}</td>
                            <td class="text-slate-300 font-mono">${p.FGM || 0}/${p.FGA || 0}</td>
                            <td class="text-xs text-slate-500">${getRate(p.FGM, p.FGA)}%</td>
                            <td class="text-slate-300 font-mono">${p.TPM || 0}/${p.TPA || 0}</td>
                            <td class="text-xs text-slate-500">${getRate(p.TPM, p.TPA)}%</td>
                            <td class="text-slate-300 font-mono">${p.FTM || 0}/${p.FTA || 0}</td>
                            <td class="text-xs text-slate-500">${getRate(p.FTM, p.FTA)}%</td>
                            <td>${p.OR || 0}</td>
                            <td>${p.DR || 0}</td>
                            <td class="font-bold text-slate-200">${p.REB || 0}</td>
                            <td>${p.AST || 0}</td>
                            <td>${p.STL || 0}</td>
                            <td>${p.BLK || 0}</td>
                            <td>${p.TO || 0}</td>
                            <td class="border-l border-[#30363d] text-center px-4">
                                <span class="font-black text-base ${gradeStyle}">${rowPER.toFixed(1)}</span>
                                <span class="text-[10px] ${gradeStyle} ml-1 tracking-tighter">(${grade})</span>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="19" class="py-10 text-red-500 text-center">데이터를 불러오지 못했습니다. URL을 확인하세요.</td></tr>';
            }
        }

        function updateTeamFoulUI(count, qName) {
            const display = document.getElementById('team-foul-display');
            if (qName === 'TOTAL') { display.innerHTML = ''; return; }

            const isBonus = count >= 5;
            display.innerHTML = `
                <div class="flex items-center gap-4 bg-[#161b22] px-6 py-2.5 rounded-full border border-slate-700 shadow-xl">
                    <span class="text-xs font-black text-slate-400 tracking-widest">${qName} ${isBonus ? '<span class="animate-bonus text-red-500">BONUS</span>' : 'TEAM FOUL'}</span>
                    <div class="flex gap-1.5">
                        ${[1, 2, 3, 4, 5].map(i => `
                            <div class="w-3 h-3 rounded-full ${i <= count ? (i >= 5 ? 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]' : 'bg-orange-500') : 'bg-slate-800'} transition-all"></div>
                        `).join('')}
                    </div>
                    <span class="text-xl font-black ${isBonus ? 'text-red-500' : 'text-white'} ml-1">${count}</span>
                </div>
            `;
        }

        function updateButtonUI(activeQ) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === activeQ || (btn.innerText === '전체' && activeQ === 'TOTAL'));
            });
        }
    </script>
</body>
</html>

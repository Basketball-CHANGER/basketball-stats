<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANGER Stats Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .q-btn.active { 
            background-color: #238636 !important; 
            color: white !important; 
            border-color: #3fb950 !important; 
            box-shadow: 0 0 12px rgba(63, 185, 80, 0.4);
            font-weight: bold;
        }
        .table-wrapper { margin-top: 16px; background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; overflow: hidden; }
        th { background-color: #1f2937; color: #8b949e; font-size: 0.75rem; padding: 12px 4px; border-bottom: 2px solid #30363d; }
        td { padding: 10px 6px; border-bottom: 1px solid #21262d; font-size: 0.9rem; text-align: center; }
        .name-col { color: #58a6ff; font-weight: bold; text-align: center !important; width: 120px; min-width: 120px; }
        .foul-danger { color: #f85149; font-weight: bold; background: rgba(248, 81, 73, 0.1); border-radius: 6px; }
        
        .stats-dashboard { margin-top: 12px; border-radius: 14px; padding: 15px 25px; border: 1px solid #30363d; }
        .home-dashboard { background: linear-gradient(90deg, #161b22 0%, #0d1424 100%); border-left: 5px solid #3b82f6; }
        .away-dashboard { background: linear-gradient(90deg, #1c1111 0%, #161b22 100%); border-left: 5px solid #ef4444; }
        
        .stat-grid { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 1.8rem; align-items: center; }
        .stat-box { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .stat-label { color: #8b949e; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { color: white; font-weight: 900; font-size: 1.4rem; line-height: 1; }
        .stat-pct { font-size: 11px; font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1440px] mx-auto">
        <!-- 헤더 -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-white italic uppercase">Changer</h1>
                <span id="match-title-display" class="bg-blue-900/40 text-blue-400 text-xs font-bold px-4 py-1.5 rounded-full border border-blue-800/50">SYNCING...</span>
            </div>
            <div class="flex bg-[#161b22] p-1.5 rounded-xl border border-[#30363d]">
                <button onclick="loadData('TOTAL')" class="q-btn px-5 py-2 rounded-lg text-sm transition-all">전체</button>
                <button onclick="loadData('1Q')" class="q-btn px-5 py-2 rounded-lg text-sm transition-all">1Q</button>
                <button onclick="loadData('2Q')" class="q-btn px-5 py-2 rounded-lg text-sm transition-all">2Q</button>
                <button onclick="loadData('3Q')" class="q-btn px-5 py-2 rounded-lg text-sm transition-all">3Q</button>
                <button onclick="loadData('4Q')" class="q-btn px-5 py-2 rounded-lg text-sm transition-all">4Q</button>
            </div>
        </div>

        <!-- 스코어보드 -->
        <div class="grid grid-cols-3 gap-4 bg-[#161b22] p-8 rounded-[32px] border border-[#30363d] items-center mb-6">
            <div class="text-center">
                <p class="text-blue-400 font-black text-xs mb-2 uppercase tracking-widest">Home</p>
                <p id="our-score" class="text-7xl font-black text-white leading-none mb-3">0</p>
                <div class="flex justify-center items-baseline gap-2"><span class="text-slate-500 text-xl font-black">TF</span><span id="our-foul-val" class="text-2xl font-black text-white">0</span></div>
            </div>
            <div class="text-center">
                <p id="current-q-label" class="text-yellow-500 text-4xl font-black italic mb-1 uppercase">TOTAL</p>
                <p class="text-slate-600 text-xs font-bold tracking-[0.5em]">V S</p>
            </div>
            <div class="text-center">
                <p id="opp-name-display" class="text-red-400 font-black text-xs mb-2 uppercase tracking-widest">Away</p>
                <p id="opp-score" class="text-7xl font-black text-white leading-none mb-3">0</p>
                <div class="flex justify-center items-baseline gap-2"><span class="text-slate-500 text-xl font-black">TF</span><span id="opp-foul-val" class="text-2xl font-black text-white">0</span></div>
            </div>
        </div>

        <!-- HOME SUMMARY -->
        <div class="stats-dashboard home-dashboard mb-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <span class="text-blue-500 font-black text-xl italic uppercase">HOME SUMMARY</span>
                <div class="stat-grid">
                    <div class="stat-box"><p class="stat-label">2P</p><p id="home-f-2p" class="stat-value">0/0</p><p id="home-f-2p-pct" class="stat-pct text-blue-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">3P</p><p id="home-f-3p" class="stat-value">0/0</p><p id="home-f-3p-pct" class="stat-pct text-blue-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">FT</p><p id="home-f-ft" class="stat-value">0/0</p><p id="home-f-ft-pct" class="stat-pct text-blue-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">REB</p><p id="home-f-reb" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">AST</p><p id="home-f-ast" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">STL</p><p id="home-f-stl" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">TO</p><p id="home-f-to" class="stat-value text-red-500">0</p></div>
                </div>
            </div>
        </div>

        <!-- 상세 테이블 -->
        <div class="table-wrapper overflow-x-auto mb-6">
            <table class="w-full border-collapse min-w-[1200px]">
                <thead>
                    <tr>
                        <th>No</th><th class="name-col">NAME</th><th class="text-orange-400">PF</th><th>MIN</th><th class="text-white">PTS</th>
                        <th>2P M/A</th><th>2P%</th><th>3P M/A</th><th>3P%</th><th>FT M/A</th><th>FT%</th>
                        <th>OR</th><th>DR</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th>
                        <th class="text-yellow-400 border-l border-slate-700">PER</th><th>GRADE</th>
                    </tr>
                </thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>

        <!-- AWAY SUMMARY -->
        <div id="opp-stats-footer" class="stats-dashboard away-dashboard">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <span class="text-red-500 font-black text-xl italic uppercase"><span id="opp-footer-name">AWAY</span> SUMMARY</span>
                <div class="stat-grid">
                    <div class="stat-box"><p class="stat-label">2P</p><p id="opp-f-2p" class="stat-value">0/0</p><p id="opp-f-2p-pct" class="stat-pct text-red-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">3P</p><p id="opp-f-3p" class="stat-value">0/0</p><p id="opp-f-3p-pct" class="stat-pct text-red-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">FT</p><p id="opp-f-ft" class="stat-value">0/0</p><p id="opp-f-ft-pct" class="stat-pct text-red-400">0%</p></div>
                    <div class="stat-box"><p class="stat-label">REB</p><p id="opp-f-reb" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">STL</p><p id="opp-f-stl" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">BLK</p><p id="opp-f-blk" class="stat-value">0</p></div>
                    <div class="stat-box"><p class="stat-label">TO</p><p id="opp-f-to" class="stat-value text-red-800">0</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbwR0He56kxFij9AU01Yp68vOMuT7W9LiYr0mgvpjjXekxrPLq4_G2bEOMOye7Pg3NDB/exec";

        const calcPct = (m, a) => {
            const made = parseFloat(m) || 0;
            const attempt = parseFloat(a) || 0;
            return (attempt > 0) ? Math.round((made / attempt) * 100) : 0;
        };

        async function loadData(q) {
            document.querySelectorAll('.q-btn').forEach(btn => {
                const btnText = btn.innerText === '전체' ? 'TOTAL' : btn.innerText;
                btn.classList.toggle('active', btnText === q);
            });
            document.getElementById('current-q-label').innerText = q;

            try {
                const response = await fetch(`${BASE_API_URL}?q=${q}`);
                const data = await response.json();

                document.getElementById('match-title-display').innerText = data.matchTitle || "경기 정보 없음";

                // 1. 우리팀 요약 (Home) - 대문자 Key 적용
                if (data.teamTotal) {
                    const t = data.teamTotal;
                    document.getElementById('our-score').innerText = t.PTS || 0;
                    document.getElementById('home-f-2p').innerText = `${t.FG2M || 0}/${t.FG2A || 0}`;
                    document.getElementById('home-f-2p-pct').innerText = `${t.FG2_PCT || 0}%`;
                    document.getElementById('home-f-3p').innerText = `${t.TPM || 0}/${t.TPA || 0}`;
                    document.getElementById('home-f-3p-pct').innerText = `${t.TP_PCT || 0}%`;
                    document.getElementById('home-f-ft').innerText = `${t.FTM || 0}/${t.FTA || 0}`;
                    document.getElementById('home-f-ft-pct').innerText = `${t.FT_PCT || 0}%`;
                    document.getElementById('home-f-reb').innerText = t.REB || 0;
                    document.getElementById('home-f-ast').innerText = t.AST || 0;
                    document.getElementById('home-f-stl').innerText = t.STL || 0;
                    document.getElementById('home-f-to').innerText = t.TO || 0;
                }

                // 2. 상대팀 요약 (Away) - 대문자 Key 적용
                if (data.opp) {
                    const o = data.opp;
                    document.getElementById('opp-name-display').innerText = o.NAME || "상대팀";
                    document.getElementById('opp-footer-name').innerText = o.NAME || "상대팀";
                    document.getElementById('opp-score').innerText = o.PTS || 0;
                    
                    const oppFoulVal = o.PF || 0;
                    const oppFoulElem = document.getElementById('opp-foul-val');
                    oppFoulElem.innerText = oppFoulVal;
                    oppFoulElem.className = oppFoulVal >= 5 ? "text-2xl font-black text-red-500" : "text-2xl font-black text-white";

                    document.getElementById('opp-f-2p').innerText = `${o.FGM || 0}/${o.FGA || 0}`;
                    document.getElementById('opp-f-2p-pct').innerText = `${o.FG2_PCT || 0}%`;
                    document.getElementById('opp-f-3p').innerText = `${o.TPM || 0}/${o.TPA || 0}`;
                    document.getElementById('opp-f-3p-pct').innerText = `${o.TP_PCT || 0}%`;
                    document.getElementById('opp-f-ft').innerText = `${o.FTM || 0}/${o.FTA || 0}`;
                    document.getElementById('opp-f-ft-pct').innerText = `${o.FT_PCT || 0}%`;
                    document.getElementById('opp-f-reb').innerText = o.REB || 0;
                    document.getElementById('opp-f-stl').innerText = o.STL || 0;
                    document.getElementById('opp-f-blk').innerText = o.BLK || 0;
                    document.getElementById('opp-f-to').innerText = o.TO || 0;
                }

                // 3. 우리팀 팀 파울
                const teamStats = data.stats || [];
                const totalFoul = teamStats.reduce((acc, p) => acc + (parseFloat(p.PF) || 0), 0);
                const ourFoulElem = document.getElementById('our-foul-val');
                ourFoulElem.innerText = totalFoul;
                ourFoulElem.className = totalFoul >= 5 ? "text-2xl font-black text-red-500" : "text-2xl font-black text-white";

                // 4. 개별 선수 테이블
                const tbody = document.getElementById('stats-body');
                tbody.innerHTML = teamStats.map(p => {
                    const per = parseFloat(p.PER || 0);
                    let grade = per >= 25 ? "ACE" : per >= 15 ? "GOOD" : "ROLE";
                    return `
                        <tr>
                            <td>${p.No}</td>
                            <td class="name-col">${p.Name}</td>
                            <td class="${p.PF >= 4 ? 'foul-danger' : ''}">${p.PF}</td>
                            <td>${p.MIN}</td>
                            <td class="text-white font-bold">${p.PTS}</td>
                            <td>${p.FGM || 0}/${p.FGA || 0}</td><td>${calcPct(p.FGM, p.FGA)}%</td>
                            <td>${p.TPM || 0}/${p.TPA || 0}</td><td>${calcPct(p.TPM, p.TPA)}%</td>
                            <td>${p.FTM || 0}/${p.FTA || 0}</td><td>${calcPct(p.FTM, p.FTA)}%</td>
                            <td>${p.OR}</td><td>${p.DR}</td><td class="text-white font-bold">${p.REB}</td>
                            <td>${p.AST}</td><td>${p.STL}</td><td>${p.BLK}</td><td>${p.TO}</td>
                            <td class="text-yellow-500 font-black">${per.toFixed(1)}</td>
                            <td class="text-xs italic">${grade}</td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("데이터 로드 실패:", err);
            }
        }

        window.onload = () => loadData('TOTAL');
    </script>
</body>
</html>

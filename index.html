<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANGER Stats Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .q-btn.active { 
            background-color: #238636 !important; 
            color: white !important; 
            border-color: #3fb950 !important; 
            box-shadow: 0 0 12px rgba(63, 185, 80, 0.4);
            font-weight: bold;
        }
        .table-wrapper { margin-top: 30px; background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; overflow: hidden; }
        th { background-color: #1f2937; color: #8b949e; font-size: 0.7rem; padding: 12px 4px; border-bottom: 2px solid #30363d; text-align: center; }
        td { padding: 10px 6px; border-bottom: 1px solid #21262d; font-size: 0.85rem; text-align: center; }
        .name-col { color: #58a6ff; font-weight: bold; width: 130px; min-width: 130px; }
        .stats-dashboard { margin-top: 24px; border-radius: 16px; padding: 24px; border: 1px solid #30363d; }
        .home-dashboard { background: linear-gradient(90deg, #161b22 0%, #111827 100%); border-left: 4px solid #3b82f6; }
        .away-dashboard { background: linear-gradient(90deg, #1c1111 0%, #161b22 100%); border-left: 4px solid #ef4444; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-bonus { animation: pulse-red 1s infinite; color: #f85149 !important; }
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start !important; gap: 1rem; }
            .scoreboard-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-[1440px] mx-auto">
        <!-- 헤더 영역: 로고 및 파일명 -->
        <div class="flex justify-between items-center mb-8 header-top">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-3">
                    <h1 class="text-4xl font-black text-white italic uppercase tracking-tighter">Changer</h1>
                    <span id="file-name-tag" class="text-blue-400 text-sm font-bold border-l-2 border-blue-500/50 pl-3 py-1 uppercase tracking-wider leading-none">
                        LOADING...
                    </span>
                </div>
                <select id="game-selector" onchange="onGameChange()" class="bg-[#161b22] text-slate-400 text-xs border border-[#30363d] rounded-md px-3 py-2 outline-none focus:border-blue-500 transition-all cursor-pointer">
                    <option value="">경기 목록 로드 중...</option>
                </select>
            </div>
            <div class="flex bg-[#161b22] p-1.5 rounded-xl border border-[#30363d] overflow-x-auto">
                <button onclick="setQuarter('TOTAL')" class="q-btn active px-4 py-2 rounded-lg text-sm mr-1">전체</button>
                <button onclick="setQuarter('1Q')" class="q-btn px-4 py-2 rounded-lg text-sm mr-1">1Q</button>
                <button onclick="setQuarter('2Q')" class="q-btn px-4 py-2 rounded-lg text-sm mr-1">2Q</button>
                <button onclick="setQuarter('3Q')" class="q-btn px-4 py-2 rounded-lg text-sm mr-1">3Q</button>
                <button onclick="setQuarter('4Q')" class="q-btn px-4 py-2 rounded-lg text-sm">4Q</button>
            </div>
        </div>

        <!-- 스코어보드 -->
        <div class="grid grid-cols-3 gap-6 bg-[#161b22] p-6 md:p-10 rounded-[32px] border border-[#30363d] shadow-2xl items-center mb-8 scoreboard-grid">
            <div class="text-center">
                <p class="text-blue-400 font-black text-sm mb-2 uppercase tracking-widest">Home</p>
                <p id="our-score" class="text-7xl md:text-8xl font-black text-white mb-4">0</p>
                <div class="flex justify-center items-baseline gap-3">
                    <span class="text-slate-500 text-xl font-black tracking-widest">TF</span>
                    <span id="our-foul-val" class="text-xl font-black text-white">0</span>
                </div>
            </div>
            <div class="text-center border-x border-slate-800/50 px-4">
                <p id="current-q-label" class="text-yellow-500 text-4xl font-black italic mb-2 uppercase">TOTAL</p>
                <p class="text-slate-600 text-xs font-bold tracking-[0.5em]">VS</p>
            </div>
            <div class="text-center">
                <p id="opp-name-display" class="text-red-400 font-black text-sm mb-2 uppercase tracking-widest">Away</p>
                <p id="opp-score" class="text-7xl md:text-8xl font-black text-white mb-4">0</p>
                <div class="flex justify-center items-baseline gap-3">
                    <span class="text-slate-500 text-xl font-black tracking-widest">TF</span>
                    <span id="opp-foul-val" class="text-xl font-black text-white">0</span>
                </div>
            </div>
        </div>

        <!-- 우리 팀 대시보드 -->
        <div class="stats-dashboard home-dashboard mb-6">
            <div class="flex justify-between items-center mb-6">
                <span class="text-blue-500 font-black text-2xl italic uppercase">Changer Stats</span>
                <div class="grid grid-cols-5 gap-4 md:gap-10 text-center">
                    <div><p class="text-slate-500 text-[10px] font-bold">REB</p><p id="home-f-reb" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">AST</p><p id="home-f-ast" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">STL</p><p id="home-f-stl" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">BLK</p><p id="home-f-blk" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-blue-900 text-[10px] font-bold">TO</p><p id="home-f-to" class="text-blue-400 font-black text-xl">0</p></div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 border-t border-slate-800/50 pt-6">
                <div class="bg-blue-950/20 p-4 rounded-xl flex justify-between items-center">
                    <p id="home-f-2pm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="home-f-2p-pct" class="text-blue-400 font-black text-2xl">0%</p>
                </div>
                <div class="bg-blue-950/20 p-4 rounded-xl flex justify-between items-center">
                    <p id="home-f-3pm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="home-f-3p-pct" class="text-blue-300 font-black text-2xl">0%</p>
                </div>
                <div class="bg-blue-950/20 p-4 rounded-xl flex justify-between items-center">
                    <p id="home-f-ftm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="home-f-ft-pct" class="text-emerald-400 font-black text-2xl">0%</p>
                </div>
            </div>
        </div>

        <!-- 테이블 -->
        <div class="table-wrapper overflow-x-auto mb-8">
            <table class="w-full min-w-[1200px]">
                <thead>
                    <tr>
                        <th>No</th><th class="name-col">NAME</th><th>PF</th><th>MIN</th><th>PTS</th>
                        <th>2P M/A</th><th>2P%</th><th>3P M/A</th><th>3P%</th><th>FT M/A</th><th>FT%</th>
                        <th>OR</th><th>DR</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PER</th><th>GRADE</th>
                    </tr>
                </thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>

        <!-- 상대 팀 대시보드 -->
        <div class="stats-dashboard away-dashboard">
            <div class="flex justify-between items-center mb-6">
                <span class="text-red-500 font-black text-2xl italic uppercase"><span id="opp-footer-name">Away</span> Stats</span>
                <div class="grid grid-cols-5 gap-4 md:gap-10 text-center">
                    <div><p class="text-slate-500 text-[10px] font-bold">REB</p><p id="opp-f-reb" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">AST</p><p id="opp-f-ast" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">STL</p><p id="opp-f-stl" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-slate-500 text-[10px] font-bold">BLK</p><p id="opp-f-blk" class="text-white font-black text-xl">0</p></div>
                    <div><p class="text-red-900 text-[10px] font-bold">TO</p><p id="opp-f-to" class="text-red-600 font-black text-xl">0</p></div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 border-t border-slate-800/50 pt-6">
                <div class="bg-red-950/10 p-4 rounded-xl flex justify-between items-center">
                    <p id="opp-f-2pm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="opp-f-2p-pct" class="text-orange-400 font-black text-2xl">0%</p>
                </div>
                <div class="bg-red-950/10 p-4 rounded-xl flex justify-between items-center">
                    <p id="opp-f-3pm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="opp-f-3p-pct" class="text-yellow-500 font-black text-2xl">0%</p>
                </div>
                <div class="bg-red-950/10 p-4 rounded-xl flex justify-between items-center">
                    <p id="opp-f-ftm" class="text-white font-mono text-lg font-bold">0/0</p>
                    <p id="opp-f-ft-pct" class="text-emerald-400 font-black text-2xl">0%</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFileId = "";
        let currentQ = "TOTAL";

        window.onload = () => {
            google.script.run.withSuccessHandler(list => {
                const selector = document.getElementById('game-selector');
                selector.innerHTML = list.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                currentFileId = list[0].id;
                loadGameData();
            }).getGameList();
        };

        function onGameChange() {
            currentFileId = document.getElementById('game-selector').value;
            loadGameData();
        }

        function setQuarter(q) {
            currentQ = q;
            document.querySelectorAll('.q-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === q || (btn.innerText === '전체' && q === 'TOTAL'));
            });
            loadGameData();
        }

        function loadGameData() {
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '<tr><td colspan="20" class="py-20 text-center animate-pulse text-slate-600 font-bold uppercase tracking-widest">Syncing Data...</td></tr>';
            google.script.run.withSuccessHandler(renderStats).getGameData(currentFileId, currentQ);
        }

        function renderStats(data) {
            if(!data) return;
            const getRate = (m, a) => a > 0 ? Math.round((m / a) * 100) : 0;
            document.getElementById('file-name-tag').innerText = data.fileName;
            document.getElementById('current-q-label').innerText = currentQ;

            const h = {
                pts: data.stats.reduce((acc, p) => acc + p.PTS, 0),
                fl: data.stats.reduce((acc, p) => acc + p.PF, 0),
                reb: data.stats.reduce((acc, p) => acc + p.REB, 0),
                ast: data.stats.reduce((acc, p) => acc + p.AST, 0),
                stl: data.stats.reduce((acc, p) => acc + p.STL, 0),
                blk: data.stats.reduce((acc, p) => acc + p.BLK, 0),
                to: data.stats.reduce((acc, p) => acc + p.TO, 0),
                fgm: data.stats.reduce((acc, p) => acc + p.FGM, 0), fga: data.stats.reduce((acc, p) => acc + p.FGA, 0),
                tpm: data.stats.reduce((acc, p) => acc + p.TPM, 0), tpa: data.stats.reduce((acc, p) => acc + p.TPA, 0),
                ftm: data.stats.reduce((acc, p) => acc + p.FTM, 0), fta: data.stats.reduce((acc, p) => acc + p.FTA, 0)
            };

            document.getElementById('our-score').innerText = h.pts;
            document.getElementById('our-foul-val').innerText = h.fl;
            document.getElementById('home-f-reb').innerText = h.reb;
            document.getElementById('home-f-ast').innerText = h.ast;
            document.getElementById('home-f-stl').innerText = h.stl;
            document.getElementById('home-f-blk').innerText = h.blk;
            document.getElementById('home-f-to').innerText = h.to;
            document.getElementById('home-f-2pm').innerText = `${h.fgm}/${h.fga}`;
            document.getElementById('home-f-2p-pct').innerText = `${getRate(h.fgm, h.fga)}%`;
            document.getElementById('home-f-3pm').innerText = `${h.tpm}/${h.tpa}`;
            document.getElementById('home-f-3p-pct').innerText = `${getRate(h.tpm, h.tpa)}%`;
            document.getElementById('home-f-ftm').innerText = `${h.ftm}/${h.fta}`;
            document.getElementById('home-f-ft-pct').innerText = `${getRate(h.ftm, h.fta)}%`;

            if(data.opp) {
                document.getElementById('opp-name-display').innerText = data.opp.name;
                document.getElementById('opp-score').innerText = data.opp.pts;
                document.getElementById('opp-foul-val').innerText = data.opp.tf;
                document.getElementById('opp-footer-name').innerText = data.opp.name;
                document.getElementById('opp-f-reb').innerText = data.opp.reb;
                document.getElementById('opp-f-ast').innerText = data.opp.ast;
                document.getElementById('opp-f-stl').innerText = data.opp.stl;
                document.getElementById('opp-f-blk').innerText = data.opp.blk;
                document.getElementById('opp-f-to').innerText = data.opp.to;
                document.getElementById('opp-f-2pm').innerText = `${data.opp.fgm}/${data.opp.fga}`;
                document.getElementById('opp-f-2p-pct').innerText = `${getRate(data.opp.fgm, data.opp.fga)}%`;
                document.getElementById('opp-f-3pm').innerText = `${data.opp.tpm}/${data.opp.tpa}`;
                document.getElementById('opp-f-3p-pct').innerText = `${getRate(data.opp.tpm, data.opp.tpa)}%`;
                document.getElementById('opp-f-ftm').innerText = `${data.opp.ftm}/${data.opp.fta}`;
                document.getElementById('opp-f-ft-pct').innerText = `${getRate(data.opp.ftm, data.opp.fta)}%`;
            }

            document.getElementById('stats-body').innerHTML = data.stats.map(p => {
                const perVal = parseFloat(p.PER);
                let grade = perVal >= 30 ? "에이스" : perVal >= 20 ? "준수" : perVal >= 10 ? "1인분" : "노력";
                return `
                    <tr>
                        <td>${p.No}</td><td class="name-col">${p.Name}</td>
                        <td class="${p.PF >= 4 ? 'foul-danger' : ''}">${p.PF}</td>
                        <td>${p.MIN}</td><td class="text-white font-bold">${p.PTS}</td>
                        <td>${p.FGM}/${p.FGA}</td><td>${getRate(p.FGM, p.FGA)}%</td>
                        <td>${p.TPM}/${p.TPA}</td><td>${getRate(p.TPM, p.TPA)}%</td>
                        <td>${p.FTM}/${p.FTA}</td><td>${getRate(p.FTM, p.FTA)}%</td>
                        <td>${p.OR}</td><td>${p.DR}</td><td class="text-white font-bold">${p.REB}</td>
                        <td>${p.AST}</td><td>${p.STL}</td><td>${p.BLK}</td><td>${p.TO}</td>
                        <td class="border-l border-slate-800 text-yellow-500 font-black">${perVal.toFixed(1)}</td>
                        <td class="text-xs font-bold text-slate-400 italic">${grade}</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>

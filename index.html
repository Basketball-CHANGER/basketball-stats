<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANGER Stats Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .nav-btn { transition: all 0.2s; border: 1px solid #30363d; cursor: pointer; color: #8b949e; }
        /* 탭 강조 컬러 */
        .q-btn.active { 
            background-color: #238636 !important; 
            color: white !important; 
            border-color: #3fb950 !important; 
            box-shadow: 0 0 12px rgba(63, 185, 80, 0.4);
            font-weight: bold;
        }
        .table-wrapper { margin-top: 50px; background-color: #161b22; border: 1px solid #30363d; border-radius: 16px; overflow: hidden; }
        th { background-color: #1f2937; color: #8b949e; font-size: 0.7rem; padding: 14px 4px; border-bottom: 2px solid #30363d; }
        td { padding: 14px 6px; border-bottom: 1px solid #21262d; font-size: 0.85rem; text-align: center; }
        .name-col { color: #58a6ff; font-weight: bold; text-align: left !important; padding-left: 20px !important; }
        .foul-danger { color: #f85149; font-weight: bold; background: rgba(248, 81, 73, 0.1); border-radius: 6px; }
        /* 하단 상대팀 대시보드 */
        .opp-bottom-bar {
            margin-top: 24px;
            background: linear-gradient(90deg, #1c1111 0%, #161b22 100%);
            border: 1px solid #442323;
            border-radius: 16px;
            padding: 24px;
        }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-bonus { animation: pulse-red 1s infinite; color: #f85149 !important; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-[1440px] mx-auto">
        <!-- 헤더 -->
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <h1 class="text-4xl font-black text-white tracking-tighter italic">CHANGER</h1>
                <span id="match-title-display" class="bg-blue-900/40 text-blue-400 text-xs font-bold px-4 py-1.5 rounded-full border border-blue-800/50">LOADING...</span>
            </div>
            <div class="flex bg-[#161b22] p-1.5 rounded-xl border border-[#30363d]">
                <button onclick="loadData('TOTAL')" class="q-btn active px-6 py-2.5 rounded-lg text-sm mr-1 transition-all">전체</button>
                <button onclick="loadData('1Q')" class="q-btn px-6 py-2.5 rounded-lg text-sm mr-1 transition-all">1Q</button>
                <button onclick="loadData('2Q')" class="q-btn px-6 py-2.5 rounded-lg text-sm mr-1 transition-all">2Q</button>
                <button onclick="loadData('3Q')" class="q-btn px-6 py-2.5 rounded-lg text-sm mr-1 transition-all">3Q</button>
                <button onclick="loadData('4Q')" class="q-btn px-6 py-2.5 rounded-lg text-sm transition-all">4Q</button>
            </div>
        </div>

        <!-- 상단 스코어보드 (팀파울 강조) -->
        <div class="grid grid-cols-3 gap-6 bg-[#161b22] p-10 rounded-[32px] border border-[#30363d] shadow-2xl items-center mb-10">
            <div class="text-center">
                <p class="text-blue-400 font-black text-sm mb-2 tracking-widest">HOME</p>
                <p id="our-score" class="text-7xl font-black text-white mb-4">0</p>
                <div class="inline-flex items-center gap-3 px-5 py-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-slate-500 text-lg font-bold">TF</span>
                    <span id="our-foul-val" class="text-3xl font-black text-white">0</span>
                </div>
            </div>
            <div class="text-center border-x border-slate-800/50 px-4">
                <p id="current-q-label" class="text-yellow-500 text-3xl font-black italic mb-2 tracking-tighter">TOTAL</p>
                <p class="text-slate-600 text-lg font-bold tracking-[0.5em]">VS</p>
            </div>
            <div class="text-center">
                <p id="opp-name-display" class="text-red-400 font-black text-sm mb-2 tracking-widest uppercase">AWAY</p>
                <p id="opp-score" class="text-7xl font-black text-white mb-4">0</p>
                <div class="inline-flex items-center gap-3 px-5 py-2 rounded-xl bg-slate-900 border border-slate-800">
                    <span class="text-slate-500 text-lg font-bold">TF</span>
                    <span id="opp-foul-val" class="text-3xl font-black text-white">0</span>
                </div>
            </div>
        </div>
        
        <!-- 우리팀 테이블 -->
        <div class="table-wrapper shadow-2xl overflow-x-auto">
            <table class="w-full border-collapse min-w-[1200px]">
                <thead>
                    <tr>
                        <th class="w-12">No</th><th class="name-col">NAME</th><th class="text-orange-400">PF</th><th>MIN</th><th class="text-white">PTS</th>
                        <th>2P M/A</th><th>2P%</th><th>3P M/A</th><th>3P%</th><th>FT M/A</th><th>FT%</th>
                        <th>OR</th><th>DR</th><th class="text-slate-200">REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th>
                        <th class="text-yellow-400 font-bold border-l border-slate-700">PER</th>
                    </tr>
                </thead>
                <tbody id="stats-body"></tbody>
            </table>
        </div>

        <!-- 상대팀 하단 대시보드 (여기로 상세 기록 이동) -->
        <div id="opp-stats-footer" class="opp-bottom-bar flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span class="text-red-500 font-black text-2xl italic uppercase" id="opp-footer-name">AWAY</span>
                <span class="text-slate-600 text-xs font-bold border-l border-slate-800 pl-4 uppercase tracking-widest font-mono">Team Stats Summary</span>
            </div>
            <div class="flex gap-12 text-center">
                <div><p class="text-slate-500 text-[10px] uppercase font-bold mb-1">REB</p><p id="opp-f-reb" class="text-white font-black text-2xl">0</p></div>
                <div><p class="text-slate-500 text-[10px] uppercase font-bold mb-1">AST</p><p id="opp-f-ast" class="text-white font-black text-2xl">0</p></div>
                <div><p class="text-slate-500 text-[10px] uppercase font-bold mb-1">STL</p><p id="opp-f-stl" class="text-white font-black text-2xl">0</p></div>
                <div><p class="text-slate-500 text-[10px] uppercase font-bold mb-1">BLK</p><p id="opp-f-blk" class="text-white font-black text-2xl">0</p></div>
                <div><p class="text-red-900 text-[10px] uppercase font-bold mb-1">TO</p><p id="opp-f-to" class="text-red-600 font-black text-2xl">0</p></div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 주의: 본인의 GAS 배포 URL로 교체하세요!
        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbz-NYy-9gMYl7BkUh9kuZr1t1ukk9-byQVVPl1iMBKrzPb36mCxD5J6gnn_Zs6taAae/exec";

        window.onload = () => loadData('TOTAL');

        async function loadData(q) {
            // 탭 강조 표시
            document.querySelectorAll('.q-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === q || (btn.innerText === '전체' && q === 'TOTAL'));
            });
            document.getElementById('current-q-label').innerText = q;

            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '<tr><td colspan="19" class="py-20 text-slate-500 animate-pulse text-center font-bold uppercase tracking-widest">Syncing Data...</td></tr>';

            try {
                const response = await fetch(`${BASE_API_URL}?q=${q}`);
                const data = await response.json();

                document.getElementById('match-title-display').innerText = data.matchTitle || "NO TITLE";

                // 상단 스코어 업데이트
                const ourPts = data.stats.reduce((acc, p) => acc + (p.PTS || 0), 0);
                const ourFls = data.stats.reduce((acc, p) => acc + (p.PF || 0), 0);
                document.getElementById('our-score').innerText = ourPts;
                document.getElementById('our-foul-val').innerText = ourFls;
                document.getElementById('our-foul-val').className = ourFls >= 5 ? "text-3xl font-black animate-bonus" : "text-3xl font-black text-white";

                // 상대팀 정보 업데이트
                if(data.opp) {
                    document.getElementById('opp-name-display').innerText = data.opp.name;
                    document.getElementById('opp-score').innerText = data.opp.pts;
                    document.getElementById('opp-foul-val').innerText = data.opp.tf;
                    document.getElementById('opp-foul-val').className = data.opp.tf >= 5 ? "text-3xl font-black animate-bonus" : "text-3xl font-black text-white";
                    
                    // 하단 대시보드 업데이트
                    document.getElementById('opp-footer-name').innerText = data.opp.name;
                    document.getElementById('opp-f-reb').innerText = data.opp.reb;
                    document.getElementById('opp-f-ast').innerText = data.opp.ast;
                    document.getElementById('opp-f-stl').innerText = data.opp.stl;
                    document.getElementById('opp-f-blk').innerText = data.opp.blk;
                    document.getElementById('opp-f-to').innerText = data.opp.to;
                }

                // 우리팀 테이블 렌더링
                tbody.innerHTML = data.stats.map(p => {
                    const getRate = (m, a) => a > 0 ? Math.round((m / a) * 100) : 0;
                    return `
                        <tr>
                            <td class="text-slate-600 font-mono text-xs">${p.No}</td>
                            <td class="name-col">${p.Name}</td>
                            <td class="${p.PF >= 4 ? 'foul-danger' : ''}">${p.PF}</td>
                            <td class="text-slate-500 font-mono text-xs">${p.MIN}</td>
                            <td class="text-white font-bold">${p.PTS}</td>
                            <td class="text-slate-400 font-mono">${p.FGM}/${p.FGA}</td>
                            <td class="text-[10px] text-slate-600 font-mono">${getRate(p.FGM, p.FGA)}%</td>
                            <td class="text-slate-400 font-mono">${p.TPM}/${p.TPA}</td>
                            <td class="text-[10px] text-slate-600 font-mono">${getRate(p.TPM, p.TPA)}%</td>
                            <td class="text-slate-400 font-mono">${p.FTM}/${p.FTA}</td>
                            <td class="text-[10px] text-slate-600 font-mono">${getRate(p.FTM, p.FTA)}%</td>
                            <td>${p.OR}</td><td>${p.DR}</td>
                            <td class="text-white font-bold">${p.REB}</td>
                            <td class="text-slate-500">${p.AST || '-'}</td>
                            <td>${p.STL}</td><td>${p.BLK}</td><td>${p.TO}</td>
                            <td class="border-l border-slate-800 text-yellow-500 font-black">${parseFloat(p.PER).toFixed(1)}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="19" class="py-20 text-red-500 text-center font-bold">연결 실패 (URL을 확인하세요)</td></tr>';
            }
        }
    </script>
</body>
</html>
